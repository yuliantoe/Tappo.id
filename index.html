    <script>
      // Filter out third-party browser extension injection errors (e.g. MetaMask / web3 wallet extension in iframes)
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var message = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
        if (
          typeof message === 'string' &&
          (message.includes('MetaMask') ||
            message.includes('ethereum') ||
            message.includes('chrome-extension://') ||
            message.includes('moz-extension://'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('error', function (event) {
        var message = (event && event.message) || '';
        var filename = (event && event.filename) || '';
        if (
          (typeof message === 'string' &&
            (message.includes('MetaMask') || message.includes('ethereum'))) ||
          filename.includes('chrome-extension://') ||
          filename.includes('moz-extension://')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
